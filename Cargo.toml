[workspace]
resolver = "2"
members = [
    "crates/optcg_core",
    "crates/optcg_database",
    "crates/optcg_rules",
    "crates/optcg_events",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["OPTCG Companion Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
rand = "0.8"
parking_lot = "0.12"
