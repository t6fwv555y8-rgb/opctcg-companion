<!DOCTYPE html>
<html>
  <body>
    <div class="game-board-shell">
      <span class="text-yellow-500">Phase: Main</span>
      <span class="text-yellow-500">Turn 3</span>
      <div data-zone-anchor="0:life">
        <div data-card-zone="life" data-card-player-id="0" data-card-slot="0" data-card-iid="l1">
          <img src="/cards/full/OP01-001.webp" alt="OP01-001" />
        </div>
        <div data-card-zone="life" data-card-player-id="0" data-card-slot="1" data-card-iid="l2">
          <img src="/cards/full/ST01-001.webp" alt="ST01-001" />
        </div>
      </div>
      <div data-zone-anchor="0:donField">
        <div data-don-iid="d1" data-card-zone="donField" data-card-player-id="0"></div>
        <div data-don-iid="d2" data-card-zone="donField" data-card-player-id="0" class="rotate-90"></div>
      </div>
      <div data-zone-anchor="0:character">
        <div data-card-zone="character" data-card-player-id="0" data-card-slot="0" data-card-iid="c1">
          <img src="/cards/full/OP01-025.webp" />
        </div>
        <div data-card-zone="character" data-card-player-id="0" data-card-slot="1" data-card-iid="c2">
          <img src="/cards/full/OP01-025.webp" />
        </div>
      </div>
      <div data-zone-anchor="0:leader">
        <div data-card-zone="leader" data-card-player-id="0" data-card-slot="0" data-card-iid="ld0">
          <img src="/cards/full/OP01-001.webp" />
        </div>
      </div>
      <div class="flex flex-col items-end" data-zone-anchor="0:hand">
        <div data-card-zone="hand" data-card-player-id="0" data-card-iid="h1"></div>
        <div data-card-zone="hand" data-card-player-id="0" data-card-iid="h2"></div>
        <div data-card-zone="hand" data-card-player-id="0" data-card-iid="h3"></div>
      </div>
      <div data-zone-anchor="1:life">
        <div data-card-zone="life" data-card-player-id="1" data-card-slot="0" data-card-iid="ol1">
          <img src="/cards/full/OP01-060.webp" />
        </div>
      </div>
      <div class="flex flex-col items-start" data-zone-anchor="1:hand">
        <span>Hand: 5</span>
      </div>
      <div data-zone-anchor="1:donField">
        <div data-don-iid="od1" data-card-zone="donField" data-card-player-id="1"></div>
      </div>
    </div>
  </body>
</html>
